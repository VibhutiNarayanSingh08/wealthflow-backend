name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://wealthflow-api-rz5w.onrender.com/api/health
          echo " - Pinged at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
