services:
  - type: web
    name: wealthflow-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    # Optional: add a PostgreSQL database
    # databases:
    #   - name: wealthflow-db
    #     plan: free
