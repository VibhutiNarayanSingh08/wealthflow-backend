app = "wealthflow-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  CORS_ORIGINS = "*"

# Optional: PostgreSQL
# [[mounts]]
#   source = "wealthflow_data"
#   destination = "/app/data"
